# Envoy AI Gateway / Envoy Gateway integration manifest for `trifecta-extproc`
# (standalone Go guardrail engine).
#
# Ready to reference in an upstream Envoy AI Gateway documentation or benchmark PR.
# Attaches `trifecta-extproc` (gRPC ext_proc on port 9002) to an AIGatewayRoute /
# HTTPRoute via EnvoyExtensionPolicy with:
#   - Buffered request body inspection (DLP + Prompt Injection + MCP Trifecta)
#   - Zero-buffering SSE pass-through on untainted sessions via `allowModeOverride: true`
#     (< 1 ms p99 streaming tax on benign SSE traffic)
#   - On-demand buffered response inspection for doubly-tainted sessions (EchoLeak protection)
#   - Fail-closed default (`failOpen: false`) with explicit circuit-breaker thresholds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trifecta-extproc
  namespace: envoy-ai-gateway-system
  labels:
    app.kubernetes.io/name: trifecta-extproc
    app.kubernetes.io/part-of: guardrail-bench
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trifecta-extproc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trifecta-extproc
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trifecta-extproc
          image: ghcr.io/promptcultivator/trifecta-extproc:v0.2.0
          args:
            - "--listen=:9002"
            - "--max-decode-depth=3"
            - "--max-decoded-bytes=1048576"
          ports:
            - name: grpc
              containerPort: 9002
              protocol: TCP
          readinessProbe:
            grpc:
              port: 9002
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: trifecta-extproc
  namespace: envoy-ai-gateway-system
  labels:
    app.kubernetes.io/name: trifecta-extproc
spec:
  selector:
    app.kubernetes.io/name: trifecta-extproc
  ports:
    - name: grpc
      port: 9002
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: ai-gateway-trifecta-guardrail
  namespace: envoy-ai-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      # Replace with the HTTPRoute generated by your AIGatewayRoute (aigateway.envoyproxy.io/v1alpha1).
      name: ai-gateway-default-route
  extProc:
    - backendRefs:
        - group: ""
          kind: Service
          name: trifecta-extproc
          port: 9002
      # Production default is fail-closed; set `failOpen: true` only for shadow/audit rollouts.
      failOpen: false
      messageTimeout: 500ms
      processingMode:
        allowModeOverride: true
        request:
          body: Buffered
        response:
          # Benign SSE streams stay unbuffered (ModeOverride -> NONE); doubly-tainted sessions
          # dynamically escalate to Buffered in ResponseHeaders to block EchoLeak Markdown images.
          body: None
      metadata:
        accessibleNamespaces:
          - io.envoyproxy.ai_gateway
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: trifecta-extproc-circuit-breaker
  namespace: envoy-ai-gateway-system
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: trifecta-extproc
  circuitBreaker:
    maxConnections: 1024
    maxPendingRequests: 1024
    maxParallelRequests: 2048
    maxParallelRetries: 3
